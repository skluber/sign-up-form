<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="image-sidebar">
        <div class="page-header">
            <div id="dark-background">
                <img src="img/odin-logo.png" style="width: 70px;" alt="Odin Logo">
                <h1>ODIN</h1>
            </div>
            <div id="credit">
                <p>Photo by <a href="#">Halie West</a> on <a href="#">Unsplash</a></p>
            </div>
        </div>
    </div>

    <div id="content-sidebar">
        <div id="text-sidebar">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>Sign up <em>now</em> to get started.</p>
            <p><br>You <em>know</em> you want to.</p>
        </div>

        <form action="/submit-path" method="POST" id="form-sidebar">
            <fieldset>
                <legend>Let's do this! </legend>
                <div class="form-inputs">
                    <div>
                        <label for='first-name'>First Name</label>
                        <input id='first-name' name='first-name' type='text' required/>
                    </div>
                    <div>
                        <label for="last-name">Last Name</label>
                        <input id="last-name" name="last-name" type="text" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" required>
                    </div>
                    <div>
                        <label for="phone">Phone Number</label>
                        <input id="phone" name="phone" type="tel" pattern="^(\+34|0034)?[6789]\d{8}$" title="Please enter a valid Spanish phone number (9 digits, optional +34 prefix)" placeholder="+34 600 000 000" required>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" minlength="6" required>
                    </div>
                    <div>
                        <label for="conf-password">Confirm Password</label>
                        <input id="conf-password" name="conf-password" type="password" minlength="6" required>
                    </div>
                </div>
            </fieldset>

            <div id="bottom-sidebar">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </form>
    </div>
</body>
</html>
